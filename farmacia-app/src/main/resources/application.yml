server:
  port: 8080

spring:
  application:
    name: farmacia-app

  datasource:
    url: jdbc:h2:mem:farmaciadb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

fornecedor-a:
  url: ${FORNECEDOR_A_URL:http://localhost:8083}

fornecedor-b:
  url: ${FORNECEDOR_B_URL:http://localhost:8084}
