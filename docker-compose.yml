services:
  mysql:
    image: mysql:8.0
    container_name: farmacia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - farmacia-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: farmacia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - farmacia-network

  fornecedor-a:
    build:
      context: .
      dockerfile: ./fornecedor-a-service/Dockerfile
    container_name: fornecedor-a
    ports:
      - "8083:8083"
    networks:
      - farmacia-network

  fornecedor-b:
    build:
      context: .
      dockerfile: ./fornecedor-b-service/Dockerfile
    container_name: fornecedor-b
    ports:
      - "8084:8084"
    networks:
      - farmacia-network

  produtos-estoque-service:
    build:
      context: .
      dockerfile: ./produtos-estoque-service/Dockerfile
    container_name: produtos-estoque-service
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      fornecedor-a:
        condition: service_started
      fornecedor-b:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
      FORNECEDOR_A_URL: http://fornecedor-a:8083
      FORNECEDOR_B_URL: http://fornecedor-b:8084
      ESTOQUE_MODE: ${ESTOQUE_MODE:-rest}
    networks:
      - farmacia-network

  farmacia-app:
    build:
      context: .
      dockerfile: ./farmacia-app/Dockerfile
    container_name: farmacia-app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      produtos-estoque-service:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
      PRODUTOS_SERVICE_URL: http://produtos-estoque-service:8082
      ESTOQUE_MODE: ${ESTOQUE_MODE:-rest}
    networks:
      - farmacia-network

networks:
  farmacia-network:
    driver: bridge
