server:
  port: 8082

spring:
  application:
    name: produtos-estoque-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/produtosdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Versão de integração de estoque: rest (V1) ou messaging (V2)
estoque:
  mode: ${ESTOQUE_MODE:rest}

fornecedor-a:
  url: ${FORNECEDOR_A_URL:http://localhost:8083}

fornecedor-b:
  url: ${FORNECEDOR_B_URL:http://localhost:8084}
